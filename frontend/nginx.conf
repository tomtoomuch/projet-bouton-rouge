server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    #Healthcheck du frontend
    location /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"frontend"}';
    }

    #Proxy vers le backend Express
    location /api/ {
        proxy_pass http://backend:3003/;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
