name: Projet bouton rouge - CI/CD

run-name: ${{ github.actor }} - CI/CD

on:
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

# un seul pipeline à la fois par branche (évite deux déploiements simultanés)
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false

jobs:

  # ---------------------------------------------------------------
  # 1. Qualité : tests backend + MAE du modèle <= seuil
  #    (seuil et justification : backend/ML/seuil_qualite.json)
  # ---------------------------------------------------------------
  integration:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Récupérer le code
        uses: actions/checkout@v4

      - name: 2. Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json
      
      - name: 3. Installer les dépendances du backend
        working-directory: backend
        run: npm ci

      - name: 4. Tests backend
        working-directory: backend
        run: npm test

  # ---------------------------------------------------------------
  # 2. Build des images, test en conteneurs, push sur Docker Hub
  # ---------------------------------------------------------------
  build-and-push:
    needs: integration
    runs-on: ubuntu-latest

    steps:

      - name: 1. Récupérer le code
        uses: actions/checkout@v4

      - name: 2. Connexion à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 3. Construire le backend
        run: docker build -t tomtoomuch/backend-redbutton:latest ./backend

      - name: 4. Construire le frontend
        run: docker build -t tomtoomuch/frontend-redbutton:latest ./frontend

      - name: 5. Valider Docker Compose
        run: docker compose config -q

      - name: 5. Lancer les conteneurs
        run: docker compose up -d

      - name: 8. Vérifier les conteneurs
        run: docker compose ps

      - name: 9. Tester le frontend
        run: |
          for i in $(seq 1 30); do
            if curl --fail http://localhost:4200/ ; then
              echo "Frontend disponible !"
              exit 0
            fi

            echo "Attente du frontend..."
            sleep 1
          done

          echo "Le frontend ne répond pas"
          docker compose logs frontend
          exit 1

      - name: 10. Afficher les logs
        if: always()
        run: docker compose logs

      - name: 11. Arrêter les conteneurs
        if: always()
        run: docker compose down

      - name: 12. Push backend
        if: success()
        run: docker push tomtoomuch/backend-redbutton:latest

      - name: 14. Push frontend
        if: success()
        run: docker push tomtoomuch/frontend-redbutton:latest

  # ---------------------------------------------------------------
  # 3. Déploiement sur la VM Azure
  #    Uniquement après le push des images (plus de course CI/CD),
  #    et pas sur les pull requests.
  # ---------------------------------------------------------------
  deploy:
    needs: build-and-push
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Déployer sur la VM Azure
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.VM_HOST }}
          username: ${{ vars.VM_USER }}
          password: ${{ secrets.VM_PASSWORD }}
          script: |
            set -e
            cd /home/groupe1/projet-bouton-rouge-thomas
            pwd
            ls -la
            

            # Nouvelles images depuis Docker Hub, puis redémarrage
            docker compose pull
            docker compose up -d --no-build --remove-orphans

            # Les vérifications se font depuis la VM : ports publiés sur localhost
            attendre() {
              url="$1"; nom="$2"
              for i in $(seq 1 60); do
                if curl -sf "$url" > /dev/null; then
                  echo "$nom opérationnel après $i s."
                  return 0
                fi
                sleep 1
              done
              echo "ECHEC : $nom ne répond pas ($url)"
              docker compose logs --tail 50
              return 1
            }

            attendre http://localhost:3000/health
            attendre http://localhost:4200

            echo "Déploiement réussi : services opérationnels."
            docker compose ps
